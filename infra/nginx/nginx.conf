worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Gzip compression for text assets
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 256;

  # Rate limiting: 20 req/s per IP for API, generous for static assets
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

  upstream arx_app {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS in production
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Stricter rate limit on auth endpoints
    location ~ ^/api/auth/(login|admin-login|register) {
      limit_req zone=auth_limit burst=3 nodelay;
      proxy_pass http://arx_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API rate limiting
    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://arx_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static uploads — served directly with cache headers
    location /uploads/ {
      proxy_pass http://arx_app;
      proxy_cache_bypass $http_pragma;
      add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Frontend SPA — everything else
    location / {
      proxy_pass http://arx_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
